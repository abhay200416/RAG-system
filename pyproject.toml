[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "deepagents>=0.7.39",
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.0.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.1.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "langchain-postgres>=0.0.19",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",
    "pymupdf>=2.1",
    "google-genai>=1.0.0",
]

[project.scripts]
rag = "rag:main"
rag-api = "rag.api.routes:run"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
